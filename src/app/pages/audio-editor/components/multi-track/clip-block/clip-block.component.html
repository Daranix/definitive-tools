<div
  (click)="handleClick($event)"
  (mousedown)="handleMouseDown('timeline-clip-move', $event)"
  [ngClass]="{
    'is-selected ring-2 ring-indigo-500 z-10': isSelected(),
    'cursor-crosshair': activeTool() === 'razor',
    'cursor-grab': activeTool() === 'pointer' && !isDragging(),
    'cursor-grabbing opacity-90 shadow-2xl scale-[1.01]': isDragging() && isSelected()
  }"
  class="absolute top-2 bottom-2 rounded-xl border border-slate-700/80 bg-slate-900/90 text-white shadow-md overflow-hidden timeline-clip-block select-none transition-transform group/clip"
  [style.left.%]="leftPercent()"
  [style.width.%]="widthPercent()"
  [style.borderLeftColor]="track().color"
  [style.borderLeftWidth.px]="4">

  <!-- Dynamic Vector Mirror Bars Waveform -->
  <svg
    class="absolute inset-0 w-full h-full pointer-events-none opacity-85"
    viewBox="0 0 100 40"
    preserveAspectRatio="none">
    <path
      [attr.d]="waveformSvgPath()"
      [attr.stroke]="track().color"
      stroke-width="0.55"
      stroke-linecap="round"
      fill="none">
    </path>
  </svg>

  <!-- Fade In visual triangle -->
  @if (clip().fadeIn > 0) {
    <div
      class="fade-in-triangle"
      [style.width.%]="fadeInWidthPercent()">
      <span class="absolute bottom-1 left-1.5 text-[9px] font-mono font-bold text-cyan-300 pointer-events-none opacity-80">
        {{ clip().fadeIn.toFixed(1) }}s
      </span>
    </div>
  }

  <!-- Fade Out visual triangle -->
  @if (clip().fadeOut > 0) {
    <div
      class="fade-out-triangle"
      [style.width.%]="fadeOutWidthPercent()">
      <span class="absolute bottom-1 right-1.5 text-[9px] font-mono font-bold text-pink-300 pointer-events-none opacity-80">
        {{ clip().fadeOut.toFixed(1) }}s
      </span>
    </div>
  }

  <!-- ══ SONY VEGAS STYLE FADE HANDLES ══════════════════════════════ -->
  <!-- Top-Edge Fade In Handle (Cyan dot at vertex) -->
  <div
    (mousedown)="handleFadeMouseDown('clip-fade-in', $event)"
    class="absolute top-0 h-4 w-4 -mt-0.5 z-30 cursor-ew-resize flex items-center justify-center fade-handle-in"
    [style.left.%]="fadeInWidthPercent()"
    style="transform: translateX(-50%);"
    title="Drag horizontally to adjust Fade In">
    <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 border border-slate-900 shadow-[0_0_6px_rgba(34,211,238,0.8)] hover:scale-150 transition-transform"></div>
  </div>

  <!-- Top-Edge Fade Out Handle (Pink dot at vertex) -->
  <div
    (mousedown)="handleFadeMouseDown('clip-fade-out', $event)"
    class="absolute top-0 h-4 w-4 -mt-0.5 z-30 cursor-ew-resize flex items-center justify-center fade-handle-out"
    [style.right.%]="fadeOutWidthPercent()"
    style="transform: translateX(50%);"
    title="Drag horizontally to adjust Fade Out">
    <div class="w-2.5 h-2.5 rounded-full bg-pink-400 border border-slate-900 shadow-[0_0_6px_rgba(244,114,182,0.8)] hover:scale-150 transition-transform"></div>
  </div>

  <!-- Left Trim Duration Handle (Bottom half / edge) -->
  <div
    (mousedown)="handleMouseDown('timeline-clip-left', $event)"
    class="absolute top-0 left-0 bottom-0 w-2.5 bg-white/10 hover:bg-indigo-500/80 cursor-col-resize z-20 transition"
    title="Trim Clip Start Duration">
  </div>

  <!-- Clip Title & Info -->
  <div class="relative px-3 py-1.5 flex items-center justify-between gap-1 pointer-events-none z-10">
    <div class="flex items-center gap-1.5 truncate">
      <span class="text-[11px] font-bold text-slate-100 drop-shadow truncate">{{ clip().name }}</span>
    </div>
    <span class="text-[10px] font-mono text-slate-300 drop-shadow">
      {{ formatTime(clip().trimEnd - clip().trimStart) }}
    </span>
  </div>

  <!-- Right Trim Duration Handle (Bottom half / edge) -->
  <div
    (mousedown)="handleMouseDown('timeline-clip-right', $event)"
    class="absolute top-0 right-0 bottom-0 w-2.5 bg-white/10 hover:bg-pink-500/80 cursor-col-resize z-20 transition"
    title="Trim Clip End Duration">
  </div>
</div>
